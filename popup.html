<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 260px; font: 14px/1.5 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif; color: #17241F; background: #F2F5F1; }
    .wrap { padding: 14px; display: grid; gap: 8px; }
    h1 { font: 600 16px/1.3 "Songti SC","Noto Serif CJK SC",serif; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    h1 span { width: 22px; height: 22px; display: grid; place-items: center; background: #B5321F; color: #fff; border-radius: 3px; font-size: 13px; transform: rotate(-4deg); }
    button { font: inherit; border: 1px solid #D4DDD7; background: #fff; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
    button:hover { border-color: #7D8B85; }
    button.primary { background: #2C7A58; border-color: #2C7A58; color: #fff; }
    p { margin: 0; font-size: 12px; color: #4B5B54; }
    #msg { color: #B5321F; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span>盗</span>打盗工作台</h1>
    <button class="primary" id="open">打开工作台</button>
    <button id="assist">在当前页面打开填写助手</button>
    <p>在投诉页面上使用填写助手：先点表单里的输入框，再点助手里的条目，就会填进去。助手不会提交表单。</p>
    <p id="msg"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
